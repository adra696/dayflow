    // ── STREAK ────────────────────────────────────────────────
    function calcStreak() {
      let streak = 0;
      const d = new Date();
      // start from yesterday (today is still in progress)
      d.setDate(d.getDate() - 1);
      while (true) {
        const ds = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
        const pct = calcPct(ds);
        if (pct !== null && pct >= 1) { streak++; d.setDate(d.getDate() - 1); }
        else break;
      }
      // Check if today also qualifies
      const todayPct = calcPct(todayStr());
      if (todayPct !== null && todayPct >= 1) streak++;
      return streak;
    }
    function calcHabitStreak(habitId) {
      const today = todayStr();
      const dates = Object.keys(S.days).filter(d => d <= today).sort().reverse();
      let streak = 0;
      for (const ds of dates) {
        const rec = (S.days[ds].abitudini || {})[habitId] || {};
        if (rec.saltato) { streak++; continue; }
        if (!rec.completato) break;
        streak++;
      }
      return streak;
    }

    function setupRowGestures(row, onComplete, onSwipeLeft) {
      const HOLD_MS = 700, HOLD_DRIFT = 10, SWIPE_DIST = 60;
      let timer = null, startX = 0, startY = 0, swiping = false;
      function cancelHold() { clearTimeout(timer); timer = null; row.classList.remove('holding'); }
      row.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'touch') return;
        if (e.target.closest('.skip-btn')) return;
        startX = e.clientX; startY = e.clientY; swiping = false;
        row.classList.add('holding');
        timer = setTimeout(() => { if (swiping) return; row.classList.remove('holding'); if (navigator.vibrate) navigator.vibrate([40]); onComplete(); }, HOLD_MS);
      });
      row.addEventListener('pointermove', e => {
        if (!timer && !swiping) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        const adx = Math.abs(dx), ady = Math.abs(dy);
        if (!swiping && adx > HOLD_DRIFT) cancelHold();
        if (onSwipeLeft && adx > SWIPE_DIST && adx > ady * 1.5) { swiping = true; row.style.transform = `translateX(${Math.min(dx, 0)}px)`; }
      });
      row.addEventListener('pointerup', e => {
        const dx = e.clientX - startX;
        if (swiping && dx < -SWIPE_DIST) { row.style.transform = ''; if (onSwipeLeft) onSwipeLeft(); }
        else row.style.transform = '';
        cancelHold(); swiping = false;
      });
      row.addEventListener('pointercancel', () => { row.style.transform = ''; cancelHold(); swiping = false; });
    }

    // Parser SSE incrementale: accetta chunk di testo arbitrari (anche spezzati a metà riga/evento)

    function createSSEParser(onData) {

      };

          let i;

        },
        end() { if (buf) { line(buf); buf = ''; } dispatch(); }

    // Streaming Gemini (SSE). onChunk(delta, fullText) a ogni frammento; ritorna il testo completo.
    // opts.signal = AbortSignal; un abort lancia { code: 'abort' }.
    async function geminiStream(body, onChunk, opts = {}) {
      const key = feedKey();
      if (!key) throw Object.assign(new Error('nokey'), { code: 'nokey' });

      } catch (e) { throw signal && signal.aborted ? aborted() : Object.assign(new Error('network'), { code: 'network' }); }

        const err = Object.assign(new Error('http ' + res.status), { code: 'http', status: res.status });
        try { const j = await res.json(); err.detail = j?.error?.message || ''; } catch (e) { }
        throw err;

        if (streamErr) return;
        let j; try { j = JSON.parse(payload); } catch (e) { return; }
        if (j.error) { streamErr = Object.assign(new Error('http ' + (j.error.code || '')), { code: 'http', status: j.error.code || 500, detail: j.error.message || '' }); return; }

        if (signal && signal.aborted) throw aborted();
        if (e && e.code) throw e;
        throw Object.assign(new Error('network'), { code: 'network' });
      }
      if (streamErr) throw streamErr;
      if (signal && signal.aborted) throw aborted();

        throw Object.assign(new Error('truncated'), { code: 'truncated', partial: full }); // testo troncato: mai trattarlo come completo

        st.active = true; st.startY = e.touches[0].clientY; st.dist = 0;
      }, { passive: true });
      f.addEventListener('touchmove', e => {
        if (!st.active) return;
        const dy = e.touches[0].clientY - st.startY;
        if (dy <= 0 || f.scrollTop > 0) { if (st.pulling) reset(); return; }
        st.pulling = true;
        st.dist = Math.min(120, dy * 0.55);
        f.classList.add('pulling');
        f.style.transform = `translateY(${Math.min(st.dist, 96) * 0.6}px)`;
        setPtr(st.dist);
        e.preventDefault();
      }, { passive: false });
      const end = () => { if (!st.active) return; if (st.pulling && st.dist >= FEED_PTR_THRESHOLD) fire(); else reset(); };
      f.addEventListener('touchend', end, { passive: true });
      f.addEventListener('touchcancel', reset, { passive: true });
      // desktop: rotella verso l'alto quando sei già in cima
      f.addEventListener('wheel', e => {
        if (e.deltaY >= 0 || !canPull()) { if (st.wheel) { st.wheel = 0; reset(); } return; }
        st.wheel = Math.min(140, st.wheel + Math.abs(e.deltaY) * 0.35);
        setPtr(st.wheel);
        clearTimeout(st.wheelT);
        if (st.wheel >= FEED_PTR_THRESHOLD) { st.wheel = 0; fire(); return; }
        st.wheelT = setTimeout(() => { st.wheel = 0; reset(); }, 500);
      }, { passive: true });
    }

            <div class="feed-state-icon" style="color:var(--red);background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>

    function renumberFeed() {
      const f = document.getElementById('disc-feed'); if (!f) return;
      const slides = f.querySelectorAll('.feed-slide.card');

    }
    function attachFeedEndObserver() {
      const f = document.getElementById('disc-feed'); const end = document.getElementById('disc-end');
      if (FEED.endObs) { FEED.endObs.disconnect(); FEED.endObs = null; }
      if (!f || !end || !('IntersectionObserver' in window)) return;
      FEED.endObs = new IntersectionObserver(entries => {
        if (entries.some(e => e.isIntersecting) && !FEED.moreError) loadMoreFeed();
      }, { root: f, threshold: 0.5 });
      FEED.endObs.observe(end);
      // Prefetch: osservo le ultime FEED_PREFETCH_AHEAD card (non solo l'ultima), così il batch
      // successivo parte quando davanti all'utente restano poche card. Osservo tutte quelle nel
      // range perché uno scroll rapido può saltare una card senza farla intersecare.
      const cards = [...f.querySelectorAll('.feed-slide.card')];
      cards.slice(Math.max(0, cards.length - FEED_PREFETCH_AHEAD)).forEach(c => FEED.endObs.observe(c));
      // Poche card visibili (filtro appena aperto/cambiato): parto subito, senza aspettare l'observer.
      if (cards.length <= FEED_PREFETCH_AHEAD && !FEED.moreError) loadMoreFeed();
    }
    function toggleFeedKeyVis(id) { const i = document.getElementById(id); if (i) i.type = i.type === 'password' ? 'text' : 'password'; }
    function saveFeedKey(inputId = 'disc-key-input') {

      if (!v || v.length < 20) { showToast('Chiave API non valida', 'error'); return; }

    // ── Generazione ──
    async function generateFeed(force = false) {
      if (!feedKey()) { renderFeed(); return; }
      if (FEED.loading) return;
      if (!FEED.topics.length) loadFeedTopics();
      const topics = FEED.topics;
      FEED.loading = true; FEED.error = null;
      if (force) FEED.data = null;
      FEED.moreError = null;
      renderFeed();
      try {
        const cards = await fetchFeedCards(topics, FEED_CARDS_N);
        FEED.data = { generatedAt: Date.now(), topicIds: topics.map(t => t.id), cards, stale: false };
        saveFeedCache();
        if (FEED.activeTopic !== 'all' && !topics.some(t => t.id === FEED.activeTopic)) FEED.activeTopic = 'all';
      } catch (e) {
        console.error('generateFeed', e);
        FEED.error = feedErrorMessage(e);
        if (FEED.data) showToast(FEED.error, 'error');
      }
      FEED.loading = false;
      renderFeedChips();
      renderFeed();
      const f = document.getElementById('disc-feed'); if (f) f.scrollTo({ top: 0, behavior: 'instant' });
    }
    // Chiede a Gemini n card sui topic indicati, escludendo i titoli già visti nelle ultime 24h.
    async function fetchFeedCards(topics, n) {
      const today = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const topicList = topics.map(t => `- id "${t.id}" → ${t.label}`).join('\n');
      const seen = loadFeedSeen().slice(-FEED_SEEN_MAX);
      const seenBlock = seen.length
        ? `\n\nNOTIZIE GIÀ MOSTRATE ALL'UTENTE (non riproporle, nemmeno riformulate o con un angolo diverso sullo stesso fatto; cerca fatti, protagonisti e sottotemi DIVERSI):\n${seen.map(s => '- ' + s.t).join('\n')}`
        : '';
      const prefs = loadFeedPrefs().filter(p => topics.some(t => t.id === p.topicId)).slice(-15);
      const prefBlock = prefs.length
        ? `\n\nINTERESSI DELL'UTENTE (notizie che ha aperto o su cui ha fatto domande di recente; privilegia sottotemi affini, senza ripetere questi fatti):\n${prefs.map(p => `- ${p.t} [${feedTopic(p.topicId).label}]`).join('\n')}`
        : '';
      const distrib = topics.length > 1 ? 'distribuiti in modo equilibrato tra questi argomenti' : 'tutti su questo argomento';
      const prompt = `Oggi è ${today}. Genera un feed di ${n} notizie e fatti interessanti, recenti e verosimili, scritti in italiano, ${distrib}:\n${topicList}\n\nRegole per ogni voce:\n- "topicId": esattamente uno degli id elencati.\n- "title": titolo d'impatto, massimo 12 parole, niente clickbait né punti esclamativi.\n- "summary": 2-3 frasi chiare e concrete che spiegano cosa è successo e perché conta.\n- "source": nome di una testata o fonte plausibile per quell'argomento (es. una testata italiana o internazionale, un'agenzia, una rivista scientifica).\n- "ageMinutes": minuti trascorsi dalla pubblicazione, tra 20 e 1440.\nVaria toni e sottotemi, evita ripetizioni e non inventare dichiarazioni virgolettate di persone reali.${prefBlock}${seenBlock}`;
      const schema = { type: 'ARRAY', items: { type: 'OBJECT', properties: { topicId: { type: 'STRING' }, title: { type: 'STRING' }, summary: { type: 'STRING' }, source: { type: 'STRING' }, ageMinutes: { type: 'INTEGER' } }, required: ['topicId', 'title', 'summary', 'source', 'ageMinutes'] } };
      const out = await geminiJSON(prompt, schema, 1.0);
      const seenSet = new Set(seen.map(s => s.t.toLowerCase()));
      const inFeed = new Set((FEED.data ? FEED.data.cards : []).map(c => c.title.toLowerCase()));
      const now = Date.now();
      const cards = (Array.isArray(out) ? out : []).filter(c => c && c.title).map(c => ({
        id: uid(),
        genAt: now,
        topicId: topics.some(t => t.id === c.topicId) ? c.topicId : topics[0].id,
        title: String(c.title).trim(),
        summary: String(c.summary || '').trim(),
        source: String(c.source || 'Fonte').trim(),
        ageMinutes: Math.min(1440, Math.max(5, parseInt(c.ageMinutes) || 60))
      })).filter(c => !seenSet.has(c.title.toLowerCase()) && !inFeed.has(c.title.toLowerCase()));
      if (!cards.length) throw Object.assign(new Error('empty'), { code: 'empty' });
      addFeedSeen(cards);
      return cards;
    }
    // Scroll infinito: accoda nuove card in fondo senza toccare lo scroll corrente.
    async function loadMoreFeed(retry = false) {
      if (FEED.more || FEED.loading || !FEED.data || !feedKey()) return;
      if (FEED.moreError && !retry) return;
      if (FEED.activeTopic === 'saved') return;
      const topicId = FEED.activeTopic;
      const topics = topicId === 'all' ? FEED.topics : [feedTopic(topicId)];
      const data = FEED.data;
      FEED.more = true; FEED.moreTopic = topicId; FEED.moreError = null;
      let end = document.getElementById('disc-end');
      if (end) end.querySelector('.feed-card').innerHTML = feedEndInner();
      else if (curScreen === 'recap') renderFeed();
      let cards = null, err = null;
      try { cards = await fetchFeedCards(topics, FEED_CARDS_N); } catch (e) { err = e; }
      FEED.more = false; FEED.moreTopic = null;
      // Nel frattempo il feed è stato rigenerato (pull-to-refresh): le card appartengono al vecchio feed.
      if (FEED.data !== data || FEED.loading) return;
      if (err) {
        console.error('loadMoreFeed', err);
        FEED.moreError = feedErrorMessage(err);
        end = document.getElementById('disc-end');
        if (end) end.querySelector('.feed-card').innerHTML = feedEndInner();
        else if (curScreen === 'recap' && FEED.activeTopic !== 'saved') renderFeed();
        return;
      }
      FEED.data.cards.push(...cards);
      saveFeedCache();
      appendFeedCards(cards);
    }
    // Accoda al DOM le card appena generate, ma solo quelle coerenti con il filtro ATTUALE
    // (l'utente può aver cambiato chip durante la generazione). Poi riaggancia l'observer,
    // che fa ripartire un nuovo load se per il filtro attuale restano poche card.
    function appendFeedCards(cards) {
      if (curScreen !== 'recap' || FEED.activeTopic === 'saved') return;
      const f = document.getElementById('disc-feed');
      const end = document.getElementById('disc-end');
      if (!f || !end) { renderFeed(); return; }
      const shown = cards.filter(c => FEED.activeTopic === 'all' || c.topicId === FEED.activeTopic);
      if (!shown.length) {
        // Nessuna card per questo filtro: la slide di fine resta, l'observer rilancia il load.
        end.querySelector('.feed-card').innerHTML = feedEndInner();
        attachFeedEndObserver();
        return;
      }
      const tpl = document.createElement('template');
      tpl.innerHTML = shown.map((c, i) => feedCardHTML(c, i)).join('') + feedEndHTML();
      const nodes = [...tpl.content.children];
      // La slide "fine" è quella agganciata dallo snap: la trasformo in-place nella prima
      // nuova card (Chrome mantiene in vista l'elemento snappato anche dopo modifiche al DOM),
      // poi accodo le altre card e una nuova slide "fine".
      const first = nodes.shift();
      const wasOnEnd = Math.abs(f.scrollTop - end.offsetTop) < 4;
      end.removeAttribute('id');
      end.className = first.className;
      end.dataset.id = first.dataset.id;
      end.innerHTML = first.innerHTML;
      end.after(...nodes);
      if (wasOnEnd && Math.abs(f.scrollTop - end.offsetTop) > 2) f.scrollTo({ top: end.offsetTop, behavior: 'instant' });
      renumberFeed();
      attachFeedEndObserver();
    }
    function regenerateFeed() {
      if (FEED.loading) return;
      if (!feedKey()) { openFeedSheet('settings'); return; }
      generateFeed(true);
    }

    // ── Bottom sheet ──
    function openFeedSheet(mode, card) {

      tabs.style.display = isCard ? 'flex' : 'none';
      document.getElementById('fsheet-tab-article').classList.toggle('on', mode === 'article');
      document.getElementById('fsheet-tab-chat').classList.toggle('on', mode === 'chat');
      foot.classList.toggle('on', mode === 'chat');
      title.textContent = isCard ? (feedTopic(FEED.card.topicId).emoji + ' ' + feedTopic(FEED.card.topicId).label) : mode === 'topics' ? 'Argomenti' : 'Impostazioni Discover';
      ov.classList.add('open');

    }
    function switchFeedSheet(mode) { openFeedSheet(mode); }
    function closeFeedSheet() { abortArticleStream(); FEED.sheet = null; document.getElementById('feed-sheet').classList.remove('open'); }
    function feedSheetOverlayClick(e) { if (e.target === document.getElementById('feed-sheet')) closeFeedSheet(); }
    function renderFeedSheet() {
      const b = document.getElementById('fsheet-body'); if (!b) return;
      if (FEED.sheet === 'article') renderFeedArticle(b);
      else if (FEED.sheet === 'chat') renderFeedChatLog(b);
      else if (FEED.sheet === 'topics') renderFeedTopicsSheet(b);
      else if (FEED.sheet === 'settings') renderFeedSettingsSheet(b);
    }
    function feedCardById(id) { return (FEED.data && FEED.data.cards.find(c => c.id === id)) || loadFeedSaved().find(c => c.id === id) || null; }

    // Articolo esteso
    async function expandArticle(id) {
      const card = feedCardById(id); if (!card) return;
      if (FEED.card && FEED.card.id !== id) FEED.chat = [];
      recordFeedPref(card, 'article');
      openFeedSheet('article', card);
      if (card.fullArticle || FEED.articleStream) return;
      streamArticle(card);
    }
    // Formato testo dell'articolo (parsabile a pezzi):
    //   riga 1 = titolo · riga vuota · "## Sottotitolo" · paragrafi separati da riga vuota.
    // parseArticleText(text, final) → { title, blocks: [{ tag: 'h3'|'p', text }] }.
    // Se !final l'ultima riga incompleta è inclusa nell'ultimo blocco (titolo solo a riga chiusa).
    function parseArticleText(text, final) {
      const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
      const complete = final ? lines.length : lines.length - 1;
      const clean = s => s.replace(/\*\*|__/g, '').trim();
      let title = '', titleDone = false, para = null;
      const blocks = [];
      for (let i = 0; i < lines.length; i++) {

        item.appendChild(badge); item.appendChild(title); item.appendChild(ora); item.appendChild(delBtn);
        evList.appendChild(item);
      });
      popup.appendChild(evList);

      const form = document.createElement('div'); form.className = 'evento-form';
      form.innerHTML = `
        <input type="text" id="ev-titolo" placeholder="Nuovo evento...">
        <select id="ev-tipo"><option value="impegno">Impegno</option><option value="scadenza">Scadenza</option></select>
        <input type="time" id="ev-ora">
        <button id="ev-add">+</button>
      `;
      popup.appendChild(form);

      setTimeout(() => {
        const addBtn = document.getElementById('ev-add');
        if(addBtn) addBtn.onclick = (e) => {
          e.stopPropagation();
          const t = document.getElementById('ev-titolo').value.trim();
          if(!t) return;
          const tipo = document.getElementById('ev-tipo').value;
          const ora = document.getElementById('ev-ora').value;
          if (!day.eventi) day.eventi = [];
          day.eventi.push({id: uid(), titolo: t, tipo: tipo, ora: ora, completato: false});
          scheduleSync(ds, 'sd-an', 'st-an-sync');
          showPopup(ds, cell, ev);
          renderHeatmap();
          renderProssimi();
        };
      }, 0);

      const rect = cell.getBoundingClientRect(); const wrap = document.getElementById('shell').getBoundingClientRect();
      let left = rect.right - wrap.left + 4; let top = rect.top - wrap.top;
      if (left + 260 > wrap.width) left = rect.left - wrap.left - 260; 
      if (top + 300 > wrap.height) top = wrap.height - 320;
      popup.style.left = left + 'px'; popup.style.top = top + 'px'; popup.style.display = 'block';
      
      setTimeout(() => document.addEventListener('click', function closeP(e) { 
        if(!popup.contains(e.target) && e.target !== cell) {
            popup.style.display = 'none'; 
            document.removeEventListener('click', closeP);
        }
      }), 30);
    }
    
    function renderProssimi() {
      let wrap = document.getElementById('prossimi-wrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'prossimi-wrap';
        wrap.className = 'wh-section';
        const anScreen = document.getElementById('screen-calendario');
        const hmWrap = anScreen.querySelector('.heatmap-wrap');
        if(hmWrap) hmWrap.insertAdjacentElement('afterend', wrap);
      }
      wrap.innerHTML = '<div class="section-head" style="padding:0;border:none;margin-bottom:12px;background:none"><span class="section-label">Prossimi impegni (14 gg)</span></div>';
      
      const today = todayStr();
      const next14 = Array.from({length: 14}, (_, i) => offsetDate(today, i));
      
      let count = 0;
      next14.forEach(ds => {
        const day = S.days[ds];
        if (day && day.eventi && day.eventi.length > 0) {
          day.eventi.forEach(ev => {
            count++;
            const row = document.createElement('div'); row.className = 'prossimi-row';
            row.onclick = () => { setSelectedDate(ds); goScreen('plan', true); };
            
            const dateSpan = document.createElement('span'); dateSpan.className = 'prossimi-date'; dateSpan.textContent = fmtShort(ds);
            const badge = document.createElement('span'); badge.className = 'evento-type-badge ' + ev.tipo; badge.textContent = ev.tipo === 'scadenza' ? 'S' : 'I';
            const title = document.createElement('span'); title.className = 'prossimi-title'; title.textContent = ev.titolo;
            const ora = document.createElement('span'); ora.className = 'prossimi-ora'; ora.textContent = ev.ora || '';
            
            row.appendChild(dateSpan); row.appendChild(badge); row.appendChild(title); row.appendChild(ora);
            wrap.appendChild(row);
          });
        }
      });
      if (count === 0) {
        wrap.innerHTML += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em">Nessun impegno nei prossimi 14 giorni.</div>';
      }
    }
    function renderWeeklyHabits() {
      const c = document.getElementById('wh-section'); c.innerHTML = ''; const habits = activeHabits().filter(h => h.frequenza === 'settimanale');
      if (!habits.length) { c.innerHTML = '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em">Nessuna abitudine settimanale.</div>'; return; }
      const week = weekDays();
      habits.forEach(h => { const row = document.createElement('div'); row.className = 'wh-row'; const nm = document.createElement('div'); nm.className = 'wh-name'; nm.textContent = h.nome; const track = document.createElement('div'); track.className = 'wh-track'; let cnt = 0; for (let i = 0; i < h.targetSettimanale; i++) { const dot = document.createElement('div'); const r = week[i] && S.days[week[i]] && S.days[week[i]].abitudini[h.id] || {}; dot.className = 'wh-dot' + (r.completato ? ' done' : ''); if (r.completato) cnt++; track.appendChild(dot); } const count = document.createElement('div'); count.className = 'wh-count'; count.textContent = `${cnt}/${h.targetSettimanale}`; row.appendChild(nm); row.appendChild(track); row.appendChild(count); c.appendChild(row); });
    }

    // ── MODAL ABITUDINI ───────────────────────────────────────
    function openModal() { mMode = 'list'; renderModal(); }
    function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
    function overlayClick(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }
    function renderModal() {
      document.getElementById('modal-overlay').classList.add('open');
      if (mMode === 'list') renderModalList(); else renderModalForm(mMode === 'edit' ? S.habits.find(h => h.id === editId) : null);
    }
    function renderModalList() {
      document.getElementById('modal-title').textContent = 'Gestione abitudini';
      const body = document.getElementById('modal-body'); body.innerHTML = ''; const habits = activeHabits();
      if (!habits.length) { const e = document.createElement('div'); e.className = 'empty-state'; e.innerHTML = '<div class="empty-lbl">Nessuna abitudine ancora</div>'; body.appendChild(e); }
      habits.forEach(h => {
        const row = document.createElement('div'); row.className = 'hmanage-row'; row.draggable = true;
        row.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', h.id); row.classList.add('dragging'); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => e.preventDefault());
        row.addEventListener('drop', (e) => {
          e.preventDefault(); const dId = e.dataTransfer.getData('text/plain');
          if (dId && dId !== h.id) {
            const arr = activeHabits(); const dIdx = arr.findIndex(x => x.id === dId); const tIdx = arr.findIndex(x => x.id === h.id);
            const dH = arr.splice(dIdx, 1)[0]; arr.splice(tIdx, 0, dH); arr.forEach((x, i) => x.ordine = i);
            persist(); sbSaveHabits(); renderModalList(); if (curScreen === 'plan') renderHPlanList();
          }
        });
        row.onclick = (e) => { if (e.target.closest('.arr-btn')) return; editId = h.id; mMode = 'edit'; renderModal(); };
        const handle = document.createElement('div'); handle.className = 'drag-handle'; handle.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
        const info = document.createElement('div'); info.className = 'hmanage-info';
        const nm = document.createElement('div'); nm.className = 'hmanage-name'; nm.textContent = h.nome;
        const meta = document.createElement('div'); meta.className = 'hmanage-meta'; meta.textContent = h.frequenza === 'settimanale' ? `settimanale × ${h.targetSettimanale}` : 'giornaliera';
        info.appendChild(nm); info.appendChild(meta);
        const arrows = document.createElement('div'); arrows.className = 'arrows';
        const up = document.createElement('button'); up.className = 'arr-btn'; up.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="18 15 12 9 6 15"/></svg>'; up.onclick = e => { e.stopPropagation(); moveHabit(h.id, -1); };
        const dn = document.createElement('button'); dn.className = 'arr-btn'; dn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>'; dn.onclick = e => { e.stopPropagation(); moveHabit(h.id, 1); };
        arrows.appendChild(up); arrows.appendChild(dn);
        row.appendChild(handle); row.appendChild(info); row.appendChild(arrows); body.appendChild(row);
      });
      const addBtn = document.createElement('button'); addBtn.className = 'add-habit-btn'; addBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Aggiungi abitudine'; addBtn.onclick = () => { mMode = 'add'; renderModal(); }; body.appendChild(addBtn);
    }
    function moveHabit(id, dir) { const habits = activeHabits(); const idx = habits.findIndex(h => h.id === id); const nIdx = idx + dir; if (nIdx < 0 || nIdx >= habits.length) return; const tmp = habits[idx].ordine; habits[idx].ordine = habits[nIdx].ordine; habits[nIdx].ordine = tmp; persist(); sbSaveHabits(); renderModalList(); if (curScreen === 'plan') renderHPlanList(); }
    function renderModalForm(habit) {
      document.getElementById('modal-title').textContent = habit ? 'Modifica abitudine' : 'Nuova abitudine';
      const body = document.getElementById('modal-body'); body.innerHTML = ''; const form = document.createElement('div'); form.className = 'modal-form'; const isSett = habit && habit.frequenza === 'settimanale';
      form.innerHTML = `<div class="form-row"><label class="form-label">Nome</label><input class="form-input" id="f-nome" type="text" placeholder="Es. Bere acqua"></div><div class="form-row"><label class="form-label">Frequenza</label><select class="form-select" id="f-freq" onchange="document.getElementById('f-trow').style.display=this.value==='settimanale'?'block':'none'"><option value="giornaliera"${!isSett ? ' selected' : ''}>Giornaliera</option><option value="settimanale"${isSett ? ' selected' : ''}>Settimanale</option></select></div><div class="form-row" id="f-trow" style="display:${isSett ? 'block' : 'none'}"><label class="form-label">Obiettivo settimanale (volte)</label><input class="form-input" id="f-target" type="number" min="1" max="7" value="${habit ? habit.targetSettimanale || 3 : 3}"></div>`;
      const btns = document.createElement('div'); btns.className = 'form-btns';
      const sv = document.createElement('button'); sv.className = 'btn-pri'; sv.textContent = habit ? 'Salva' : 'Aggiungi'; sv.onclick = () => submitForm(habit ? habit.id : null);
      const bk = document.createElement('button'); bk.className = 'btn-sec'; bk.textContent = 'Indietro'; bk.onclick = () => { mMode = 'list'; renderModal(); };
      btns.appendChild(sv); btns.appendChild(bk);
      if (habit) { const dl = document.createElement('button'); dl.className = 'btn-del'; dl.textContent = 'Elimina'; dl.onclick = () => deleteHabit(habit.id); btns.appendChild(dl); }
      form.appendChild(btns); body.appendChild(form);
      const nomeInput = document.getElementById('f-nome');
      if (habit) nomeInput.value = habit.nome;
      nomeInput.focus();
    }
    function submitForm(id) {
      const nome = document.getElementById('f-nome').value.trim(); if (!nome) return;
      const freq = document.getElementById('f-freq').value; const target = parseInt(document.getElementById('f-target')?.value) || 3;
      if (id) { const h = S.habits.find(h => h.id === id); if (h) { h.nome = nome; h.frequenza = freq; h.targetSettimanale = target; } }
      else { const maxOrd = S.habits.length ? Math.max(...S.habits.map(h => h.ordine)) : 0; S.habits.push({ id: uid(), nome, frequenza: freq, targetSettimanale: target, ordine: maxOrd + 1, attiva: true }); }
      persist(); sbSaveHabits(); mMode = 'list'; renderModal(); if (curScreen === 'plan') renderPlan(); if (curScreen === 'oggi') renderOggi();
    }
    function deleteHabit(id) { if (!confirm('Eliminare questa abitudine?')) return; S.habits = S.habits.filter(h => h.id !== id); persist(); sbSaveHabits(); mMode = 'list'; renderModal(); if (curScreen === 'plan') renderPlan(); if (curScreen === 'oggi') renderOggi(); }

    // ── MODAL IMPEGNI RICORRENTI ──────────────────────────────
    let impegniMode = 'list';
    let editImpId = null;
    const GIORNI_LBL = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];
    const GIORNI_FULL = ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'];

    function activeImpegni() {
      const arr = (S.impegniRicorrenti || []).filter(r => r.attivo !== false);
      return arr.slice().sort((a, b) => (a.ordine || 0) - (b.ordine || 0));
    }

    function openImpegniModal() { impegniMode = 'list'; renderImpegniModal(); }

    function renderImpegniModal() {
      document.getElementById('modal-overlay').classList.add('open');
      if (impegniMode === 'list') renderImpegniList();
      else renderImpegniForm(impegniMode === 'edit' ? (S.impegniRicorrenti || []).find(r => r.id === editImpId) : null);
    }

    function renderImpegniList() {
      document.getElementById('modal-title').textContent = 'Gestione impegni ricorrenti';
      const body = document.getElementById('modal-body'); body.innerHTML = '';
      const list = activeImpegni();
      if (!list.length) { const e = document.createElement('div'); e.className = 'empty-state'; e.innerHTML = '<div class="empty-lbl">Nessun impegno ricorrente</div>'; body.appendChild(e); }
      list.forEach(r => {
        const row = document.createElement('div'); row.className = 'hmanage-row'; row.draggable = true;
        row.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', r.id); row.classList.add('dragging'); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => e.preventDefault());
        row.addEventListener('drop', (e) => {
          e.preventDefault(); const dId = e.dataTransfer.getData('text/plain');
          if (dId && dId !== r.id) {
            const arr = activeImpegni(); const dIdx = arr.findIndex(x => x.id === dId); const tIdx = arr.findIndex(x => x.id === r.id);
            const dR = arr.splice(dIdx, 1)[0]; arr.splice(tIdx, 0, dR); arr.forEach((x, i) => x.ordine = i);
            persist(); sbSaveHabits(); renderImpegniList(); renderImpegniSection();
          }
        });
        row.onclick = (e) => { if (e.target.closest('.arr-btn')) return; editImpId = r.id; impegniMode = 'edit'; renderImpegniModal(); };
        const handle = document.createElement('div'); handle.className = 'drag-handle'; handle.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
        const info = document.createElement('div'); info.className = 'hmanage-info';
        const nm = document.createElement('div'); nm.className = 'hmanage-name'; nm.textContent = r.titolo;
        const meta = document.createElement('div'); meta.className = 'hmanage-meta';
        const gg = (r.giorniSettimana || []).slice().sort((a, b) => a - b).map(g => GIORNI_FULL[g - 1]).join(' ');
        meta.textContent = (gg || 'nessun giorno') + (r.ora ? ` · ${r.ora}` : '');
        info.appendChild(nm); info.appendChild(meta);
        const arrows = document.createElement('div'); arrows.className = 'arrows';
        const up = document.createElement('button'); up.className = 'arr-btn'; up.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="18 15 12 9 6 15"/></svg>'; up.onclick = e => { e.stopPropagation(); moveImpegno(r.id, -1); };
        const dn = document.createElement('button'); dn.className = 'arr-btn'; dn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>'; dn.onclick = e => { e.stopPropagation(); moveImpegno(r.id, 1); };
        arrows.appendChild(up); arrows.appendChild(dn);
        row.appendChild(handle); row.appendChild(info); row.appendChild(arrows); body.appendChild(row);
      });
      const addBtn = document.createElement('button'); addBtn.className = 'add-habit-btn';
      addBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Aggiungi impegno';
      addBtn.onclick = () => { impegniMode = 'add'; renderImpegniModal(); };
      body.appendChild(addBtn);
    }

    function moveImpegno(id, dir) {
      const arr = activeImpegni(); const idx = arr.findIndex(r => r.id === id); const nIdx = idx + dir;
      if (nIdx < 0 || nIdx >= arr.length) return;
      const tmp = arr[idx].ordine; arr[idx].ordine = arr[nIdx].ordine; arr[nIdx].ordine = tmp;
      persist(); sbSaveHabits(); renderImpegniList(); renderImpegniSection();
    }

    function renderImpegniForm(rec) {
      document.getElementById('modal-title').textContent = rec ? 'Modifica impegno' : 'Nuovo impegno';
      const body = document.getElementById('modal-body'); body.innerHTML = '';
      const form = document.createElement('div'); form.className = 'modal-form';
      const days = rec ? (rec.giorniSettimana || []) : [];
      const checks = GIORNI_LBL.map((lbl, i) => {
        const dNum = i + 1; const on = days.includes(dNum);
        return `<label class="day-pill${on ? ' on' : ''}"><input type="checkbox" data-d="${dNum}"${on ? ' checked' : ''}/>${lbl}</label>`;
      }).join('');
      form.innerHTML = `
        <div class="form-row"><label class="form-label">Nome</label><input class="form-input" id="if-nome" type="text" placeholder="Es. Palestra"></div>
        <div class="form-row"><label class="form-label">Ora (opzionale)</label><input class="form-input" id="if-ora" type="time" value="${rec && rec.ora ? rec.ora : ''}"></div>
        <div class="form-row"><label class="form-label">Giorni della settimana</label><div class="day-pills" id="if-days">${checks}</div></div>
      `;
      const btns = document.createElement('div'); btns.className = 'form-btns';
      const sv = document.createElement('button'); sv.className = 'btn-pri'; sv.textContent = rec ? 'Salva' : 'Aggiungi';
      sv.onclick = () => submitImpegnoForm(rec ? rec.id : null);
      const bk = document.createElement('button'); bk.className = 'btn-sec'; bk.textContent = 'Indietro';
      bk.onclick = () => { impegniMode = 'list'; renderImpegniModal(); };
      btns.appendChild(sv); btns.appendChild(bk);
      if (rec) { const dl = document.createElement('button'); dl.className = 'btn-del'; dl.textContent = 'Elimina'; dl.onclick = () => deleteImpegno(rec.id); btns.appendChild(dl); }
      form.appendChild(btns); body.appendChild(form);
      form.querySelectorAll('.day-pill input').forEach(inp => {
        inp.addEventListener('change', e => { e.currentTarget.parentElement.classList.toggle('on', e.currentTarget.checked); });
      });
      const ni = document.getElementById('if-nome');
      if (rec) ni.value = rec.titolo;
      ni.focus();
    }

    function submitImpegnoForm(id) {
      const titolo = document.getElementById('if-nome').value.trim(); if (!titolo) return;
      const ora = document.getElementById('if-ora').value || '';
      const days = Array.from(document.querySelectorAll('#if-days input:checked')).map(i => +i.dataset.d);
      if (!days.length) { alert('Seleziona almeno un giorno'); return; }
      if (!Array.isArray(S.impegniRicorrenti)) S.impegniRicorrenti = [];
      if (id) {
        const r = S.impegniRicorrenti.find(x => x.id === id);
        if (r) { r.titolo = titolo; r.ora = ora; r.giorniSettimana = days; r.attivo = r.attivo !== false; }
      } else {
        const maxOrd = S.impegniRicorrenti.length ? Math.max(...S.impegniRicorrenti.map(r => r.ordine || 0)) : -1;
        S.impegniRicorrenti.push({ id: uid(), titolo, ora, giorniSettimana: days, ordine: maxOrd + 1, attivo: true });
      }
      persist(); sbSaveHabits();
      impegniMode = 'list'; renderImpegniModal(); renderImpegniSection();
    }

    function deleteImpegno(id) {
      if (!confirm('Eliminare questo impegno ricorrente?')) return;
      S.impegniRicorrenti = (S.impegniRicorrenti || []).filter(r => r.id !== id);
      persist(); sbSaveHabits();
      impegniMode = 'list'; renderImpegniModal(); renderImpegniSection();
    }

    function renderImpegniSection() {
      const c = document.getElementById('impegni-section'); if (!c) return;
      c.innerHTML = ''; const list = activeImpegni();
      if (!list.length) { c.innerHTML = '<div class="empty-state"><div class="empty-lbl">Nessun impegno ricorrente — premi ⚙ per aggiungerne</div></div>'; return; }
      list.forEach(r => {
        const row = document.createElement('div'); row.className = 'wh-row';
        const nm = document.createElement('div'); nm.className = 'wh-name'; nm.textContent = r.titolo;
        const days = (r.giorniSettimana || []).slice().sort((a, b) => a - b);
        const track = document.createElement('div'); track.className = 'wh-days-mini';
        GIORNI_LBL.forEach((lbl, i) => {
          const dot = document.createElement('span');
          dot.className = 'day-mini' + (days.includes(i + 1) ? ' on' : '');
          dot.textContent = lbl;
          track.appendChild(dot);
        });
        const ora = document.createElement('div'); ora.className = 'wh-count'; ora.textContent = r.ora || '';
        row.appendChild(nm); row.appendChild(track); row.appendChild(ora); c.appendChild(row);
      });
    }

    // ── SWIPE & CAROUSEL NAVIGATION ────────────────────────────
    (function initSwipeNavigation() {
      const screenArea = document.getElementById('screen-area');
      if (!screenArea) return;

      const screens = ['plan', 'oggi', 'recap', 'calendario'];
      let isScrollingTimer = null;

      screenArea.addEventListener('scroll', () => {
        if (isProgrammaticScroll) return;
        const width = screenArea.clientWidth;
        if (!width) return;

        const index = Math.round(screenArea.scrollLeft / width);
        const activeName = screens[index];

        if (activeName && activeName !== curScreen) {
          curScreen = activeName;
          document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + activeName));
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === 'nav-' + activeName));

          clearTimeout(isScrollingTimer);
          isScrollingTimer = setTimeout(() => {
            if (activeName === 'plan') renderPlan();
            else if (activeName === 'oggi') renderOggi();
            else if (activeName === 'recap') renderDiscover();
            else if (activeName === 'calendario') renderCalendario();
          }, 60);
        }
      }, { passive: true });

      window.addEventListener('resize', () => {
        const targetScreen = document.getElementById('screen-' + curScreen);
        if (targetScreen && screenArea) {
          screenArea.scrollTo({ left: targetScreen.offsetLeft, behavior: 'instant' });
        }
      });
    })();

    // ── SERVICE WORKER (solo HTTPS) ────────────────────────────
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

  </script>
